<article
  class="tarjeta-clase"
  [class.tarjeta-clase--activa]="activa()"
  (click)="elegir()"
>
  <img [src]="imagenUrl()" [alt]="clase().nombre" />

  <div class="tarjeta-clase__cuerpo">
    <span class="etiqueta" [class]="'etiqueta etiqueta--' + clase().categoria">
      {{ clase().categoria }}
    </span>

    <h2 class="tarjeta-clase__nombre">{{ clase().nombre }}</h2>
    <p class="clase__desc">{{ clase().descripcion }}</p>

    <div class="tarjeta-clase__pie">
      <span class="etiqueta etiqueta--min">
        {{ clase().duracionMin }} min
      </span>

      @if (clase().duracionMin >= 60) {
        <span class="etiqueta etiqueta--larga">Larga</span>
      }
    </div>
  </div>
</article>
