<header class="barra">
  <div class="barra__interior">
    <a class="barra__marca" routerLink="/clases">
      <img src="/logo.svg" alt="Logo Gimnasio Titanes" />
      <span>Gimnasio Titanes</span>
    </a>

    <span class="barra__etiqueta">Administración</span>

    <nav class="barra__enlaces">
      <a
        class="barra__enlace"
        routerLink="/clases"
        routerLinkActive="barra__enlace--activo"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Clases
      </a>
      <a
        class="barra__enlace"
        routerLink="/horarios"
        routerLinkActive="barra__enlace--activo"
      >
        Horarios
      </a>
      <a
        class="barra__enlace"
        routerLink="/miembros"
        routerLinkActive="barra__enlace--activo"
      >
        Miembros
      </a>
    </nav>
  </div>
</header>

<router-outlet />
